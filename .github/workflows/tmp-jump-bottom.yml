name: Temporary jump bottom button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary jump bottom button' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add jump-to-bottom button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '.composer-wrap{padding:12px 18px 16px;background:linear-gradient(transparent,rgba(17,16,21,.96) 18%)}',
              '.composer-wrap{position:relative;padding:12px 18px 16px;background:linear-gradient(transparent,rgba(17,16,21,.96) 18%)}.jump-bottom{position:absolute;right:18px;top:-46px;width:38px;height:38px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#211e28;box-shadow:0 4px 14px rgba(0,0,0,.28);display:grid;place-items:center;opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:5;cursor:pointer}.jump-bottom.visible{opacity:1;transform:none;pointer-events:auto}.jump-bottom svg{width:18px;height:18px}'
            ),
            (
              '.composer-wrap{padding:8px 10px max(8px,env(safe-area-inset-bottom));background:var(--bg)}',
              '.composer-wrap{padding:8px 10px max(8px,env(safe-area-inset-bottom));background:var(--bg)}.jump-bottom{right:14px;top:-44px;width:36px;height:36px}.jump-bottom svg{width:17px;height:17px}'
            ),
            (
              '<section class="feed" id="feed"></section><div class="composer-wrap"><div class="composer">',
              '<section class="feed" id="feed"></section><div class="composer-wrap"><button class="jump-bottom" id="jumpBottom" type="button" aria-label="最新メッセージへ移動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="m7 14 5 5 5-5"></path></svg></button><div class="composer">'
            ),
            (
              "const feed=document.getElementById('feed'),title=document.getElementById('title'),desc=document.getElementById('desc'),input=document.getElementById('input'),rule=document.getElementById('roomRule'),sendBtn=document.getElementById('send'),note=document.getElementById('note'),modePill=document.getElementById('modePill'),composerWrap=document.querySelector('.composer-wrap'),composerBox=document.querySelector('.composer');",
              "const feed=document.getElementById('feed'),jumpBottom=document.getElementById('jumpBottom'),title=document.getElementById('title'),desc=document.getElementById('desc'),input=document.getElementById('input'),rule=document.getElementById('roomRule'),sendBtn=document.getElementById('send'),note=document.getElementById('note'),modePill=document.getElementById('modePill'),composerWrap=document.querySelector('.composer-wrap'),composerBox=document.querySelector('.composer');"
            ),
            (
              'function render(){const r=rooms[current];',
              "function syncJumpBottom(){const distance=feed.scrollHeight-feed.scrollTop-feed.clientHeight;jumpBottom.classList.toggle('visible',distance>72)}\nfunction jumpToBottom(){feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'})}\nfunction render(){const r=rooms[current];"
            ),
            (
              'requestAnimationFrame(()=>feed.scrollTop=feed.scrollHeight);syncWorkspaceLabels();',
              'requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;syncJumpBottom()});syncWorkspaceLabels();'
            ),
            (
              "sendBtn.addEventListener('click',send);",
              "feed.addEventListener('scroll',syncJumpBottom,{passive:true});jumpBottom.addEventListener('click',jumpToBottom);sendBtn.addEventListener('click',send);"
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code --quiet -- index.html && { echo 'No change produced'; exit 1; } || true
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['id="jumpBottom"', 'function syncJumpBottom()', "feed.addEventListener('scroll',syncJumpBottom", ".jump-bottom.visible"]
          for item in required:
              if text.count(item) != 1:
                  raise SystemExit(f'validation failed for {item!r}: {text.count(item)}')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add jump-to-bottom button'
          git push origin HEAD:main
