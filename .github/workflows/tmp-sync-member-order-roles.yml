name: Temporary sync member order roles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run temporary member order role sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync member order and role labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_desktop = '''<div class="card" data-collapse-group="members"><div class="member"><div class="mini owner">YU</div><div class="member-copy"><div class="member-name">あなた</div><div class="member-sub">オーナー / 役員</div></div><span class="state"></span></div><div class="member"><div class="mini manager">PM</div><div class="member-copy"><div class="member-name">Phase統括</div><div class="member-sub">統括 / Codex / Workを代理記録</div></div><span class="state"></span></div><div class="member"><div class="mini codex">CX</div><div class="member-copy"><div class="member-name">Codex A</div><div class="member-sub">実装担当</div></div><span class="state"></span></div><div class="member"><div class="mini codex">CX</div><div class="member-copy"><div class="member-name">Codex B</div><div class="member-sub">実装担当</div></div><span class="state idle"></span></div><div class="member"><div class="mini qa">QA</div><div class="member-copy"><div class="member-name">Work QA</div><div class="member-sub">独立レビュー担当</div></div><span class="state"></span></div><div class="member"><div class="mini accounting">¥</div><div class="member-copy"><div class="member-name">AI経理</div><div class="member-sub">コスト管理</div></div><span class="state"></span></div></div>'''
          new_desktop = '''<div class="card" data-collapse-group="members"><div class="member"><div class="mini owner">YU</div><div class="member-copy"><div class="member-name">あなた</div><div class="member-sub">Owner / Executive</div></div><span class="state"></span></div><div class="member"><div class="mini manager">PM</div><div class="member-copy"><div class="member-name">Phase統括</div><div class="member-sub">Manager AI</div></div><span class="state"></span></div><div class="member"><div class="mini qa">QA</div><div class="member-copy"><div class="member-name">Work QA</div><div class="member-sub">Reviewer</div></div><span class="state"></span></div><div class="member"><div class="mini codex">CX</div><div class="member-copy"><div class="member-name">Codex A</div><div class="member-sub">Implementation</div></div><span class="state"></span></div><div class="member"><div class="mini codex">CX</div><div class="member-copy"><div class="member-name">Codex B</div><div class="member-sub">Implementation</div></div><span class="state idle"></span></div><div class="member"><div class="mini accounting">¥</div><div class="member-copy"><div class="member-name">AI経理</div><div class="member-sub">Cost Control</div></div><span class="state"></span></div></div>'''

          old_mobile = '''<div class="drawer-members" data-collapse-group="members"><div class="drawer-member"><div class="mini owner">YU</div><div class="drawer-member-copy"><div class="drawer-member-name">あなた</div><div class="drawer-member-role">Owner / Executive</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini manager">PM</div><div class="drawer-member-copy"><div class="drawer-member-name">Phase統括</div><div class="drawer-member-role">Manager AI</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini codex">CX</div><div class="drawer-member-copy"><div class="drawer-member-name">Codex A</div><div class="drawer-member-role">Implementation</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini codex">CX</div><div class="drawer-member-copy"><div class="drawer-member-name">Codex B</div><div class="drawer-member-role">Implementation</div></div><span class="state idle"></span></div><div class="drawer-member"><div class="mini qa">QA</div><div class="drawer-member-copy"><div class="drawer-member-name">Work QA</div><div class="drawer-member-role">Reviewer</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini accounting">¥</div><div class="drawer-member-copy"><div class="drawer-member-name">AI経理</div><div class="drawer-member-role">Cost Control</div></div><span class="state"></span></div></div>'''
          new_mobile = '''<div class="drawer-members" data-collapse-group="members"><div class="drawer-member"><div class="mini owner">YU</div><div class="drawer-member-copy"><div class="drawer-member-name">あなた</div><div class="drawer-member-role">Owner / Executive</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini manager">PM</div><div class="drawer-member-copy"><div class="drawer-member-name">Phase統括</div><div class="drawer-member-role">Manager AI</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini qa">QA</div><div class="drawer-member-copy"><div class="drawer-member-name">Work QA</div><div class="drawer-member-role">Reviewer</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini codex">CX</div><div class="drawer-member-copy"><div class="drawer-member-name">Codex A</div><div class="drawer-member-role">Implementation</div></div><span class="state"></span></div><div class="drawer-member"><div class="mini codex">CX</div><div class="drawer-member-copy"><div class="drawer-member-name">Codex B</div><div class="drawer-member-role">Implementation</div></div><span class="state idle"></span></div><div class="drawer-member"><div class="mini accounting">¥</div><div class="drawer-member-copy"><div class="drawer-member-name">AI経理</div><div class="drawer-member-role">Cost Control</div></div><span class="state"></span></div></div>'''

          if s.count(old_desktop) != 1:
              raise SystemExit(f'expected desktop member block exactly once, found {s.count(old_desktop)}')
          if s.count(old_mobile) != 1:
              raise SystemExit(f'expected mobile member block exactly once, found {s.count(old_mobile)}')
          s = s.replace(old_desktop, new_desktop, 1).replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F '<div class="member-name">Work QA</div><div class="member-sub">Reviewer</div>' index.html
          grep -F '<div class="drawer-member-name">Work QA</div><div class="drawer-member-role">Reviewer</div>' index.html
          grep -F '<div class="member-name">あなた</div><div class="member-sub">Owner / Executive</div>' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: sync member roles and hierarchy'
          git push origin main
          rm .github/workflows/tmp-sync-member-order-roles.yml
          git add .github/workflows/tmp-sync-member-order-roles.yml
          git commit -m 'chore: remove temporary member sync runner'
          git push origin main
