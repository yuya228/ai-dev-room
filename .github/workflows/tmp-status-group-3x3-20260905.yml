name: Temporary 3x3 STATUS grouping patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-status-group-3x3-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch STATUS grouping
        run: python .github/tmp-status-group-3x3-20260905.py
      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser): pass
          P().feed(text)
          assert text.count('class="settings-rule-row status-rule-row"') == 1
          assert text.count('<strong>STATUS</strong>') == 1
          assert text.count('class="status-guide-grid"') == 1
          assert 'status-guide-list' not in text
          assert 'status-guide-row' not in text
          order=['CLOSED','NEXT','WAITING','START','PASS','FAIL','FIX','BLOCKED','COST']
          positions=[text.index(f'>{label}</span>') for label in order]
          assert positions == sorted(positions)
          for label in order:
              assert text.count(f'>{label}</span>') == 1
          print('3x3 STATUS grouping validation PASS')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
            exit 1
          fi
          git commit -m 'style: group Issue statuses into 3x3 section'
          git push origin HEAD:main
