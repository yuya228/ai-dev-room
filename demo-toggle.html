<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presence Row Timing Diagnostic</title>
<style>
:root{--bg:#111015;--panel:#18161e;--panel2:#17151d;--line:rgba(255,255,255,.09);--text:#f6f4f8;--muted:#a9a2b1;--green:#42d392;--accent:#8d52ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}body{padding:18px}.wrap{max-width:760px;margin:0 auto}h1{font-size:18px;margin:0 0 6px}.lead{font-size:12px;line-height:1.7;color:var(--muted);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid rgba(255,255,255,.07);border-radius:14px;background:var(--panel2);padding:14px;overflow:hidden}.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:13px;font-weight:850}.badge{font-size:9px;color:#cfc8d5;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}.presence{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}.group-label{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 6px;font-size:9px;font-weight:750;color:#8f8798;border-bottom:1px solid var(--line)}.group-label.online{order:0}.group-label.offline{order:100;border-top:1px solid var(--line)}.member{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);position:relative;z-index:1;background:var(--panel2)}.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:9px;font-weight:900}.mini.pm{background:linear-gradient(135deg,#6246ff,#c35cff)}.mini.qa{background:linear-gradient(135deg,#ffc14a,#ff5d62)}.mini.cx{background:linear-gradient(135deg,#3f8cff,#55d6be)}.name{font-size:11px;font-weight:800}.role{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toggle{width:44px;height:25px;padding:0;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#2b2831;position:relative;cursor:pointer}.knob{position:absolute;left:3px;top:2px;width:19px;height:19px;border-radius:50%;background:#8f8897;transform:translateX(0)}.toggle.on{background:rgba(66,211,146,.15);border-color:rgba(66,211,146,.30)}.toggle.on .knob{transform:translateX(17px);background:var(--green)}.readout{font-size:10px;color:#c9c3ce;min-height:34px;line-height:1.55;margin-top:10px}.timeline{height:4px;border-radius:999px;background:#302b38;overflow:hidden;margin-top:8px}.timeline span{display:block;width:0;height:100%;background:var(--accent)}.note{margin-top:14px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.055);font-size:11px;line-height:1.7;color:var(--muted)}
@media(max-width:640px){body{padding:14px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.toggle,.knob,.timeline span{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>Presence 行移動速度 比較</h1>
<div class="lead">トグルは600msで固定。行DOMとトグルDOMを保持したまま、Online / Offline の並びだけCSS orderで変更し、FLIPの行移動を 420 / 480 / 540ms で比較する。</div>
<div class="grid" id="grid"></div>
<div class="note">各カードの「Codex Sol」をタップ。トグルは全カード共通600ms。違うのは行移動速度だけなので、600msトグルと一番まとまりよく感じる行速度を選べる。本番 index.html は未変更。</div>
</div>
<script>
const ROW_PRESETS=[420,480,540];
const TOGGLE_MS=600;
const ease='cubic-bezier(.2,.8,.2,1)';
const agents=[
  {id:'manager',avatar:'PM',cls:'pm',name:'Phase統括',role:'Manager AI',online:true},
  {id:'codex',avatar:'CX',cls:'cx',name:'Codex Sol',role:'Main Implementation',online:true,target:true},
  {id:'qa',avatar:'QA',cls:'qa',name:'Work QA',role:'Reviewer',online:false}
];
const grid=document.getElementById('grid');

function buildCard(rowMs){
  const card=document.createElement('section');card.className='card';
  card.innerHTML=`<div class="title-row"><div class="title">行 ${rowMs}ms</div><div class="badge">トグル ${TOGGLE_MS}ms</div></div><div class="meta">persistent DOM / CSS order / FLIP</div><div class="presence"><div class="group-label online"><span>Online</span><span data-online-count></span></div><div class="group-label offline"><span>Offline</span><span data-offline-count></span></div></div><div class="readout">Codex Sol のトグルをタップして比較</div><div class="timeline"><span></span></div>`;
  const host=card.querySelector('.presence'),readout=card.querySelector('.readout'),fill=card.querySelector('.timeline span');
  const state=Object.fromEntries(agents.map(a=>[a.id,a.online]));
  const rows=new Map();

  agents.forEach((a,index)=>{
    const row=document.createElement('div');row.className='member';row.dataset.id=a.id;row.dataset.index=index;
    row.innerHTML=`<div class="mini ${a.cls}">${a.avatar}</div><div><div class="name">${a.name}</div><div class="role">${a.role}</div></div><button class="toggle${a.online?' on':''}" type="button" role="switch" aria-checked="${a.online}" ${a.target?'':'disabled aria-disabled="true"'}><span class="knob"></span></button>`;
    const btn=row.querySelector('.toggle'),knob=row.querySelector('.knob');
    btn.style.transition=`background-color ${TOGGLE_MS}ms ${ease},border-color ${TOGGLE_MS}ms ${ease},transform .14s ease`;
    knob.style.transition=`transform ${TOGGLE_MS}ms ${ease},background-color ${TOGGLE_MS}ms ${ease}`;
    rows.set(a.id,row);host.appendChild(row);
    if(a.target)btn.addEventListener('click',()=>toggleTarget(a.id));
  });
  fill.style.transition=`width ${TOGGLE_MS}ms ${ease}`;

  function applyOrder(){
    let onlineIndex=0,offlineIndex=0;
    agents.forEach(a=>{
      const row=rows.get(a.id);
      row.style.order=state[a.id]?10+onlineIndex++:110+offlineIndex++;
    });
    card.querySelector('[data-online-count]').textContent=onlineIndex;
    card.querySelector('[data-offline-count]').textContent=offlineIndex;
  }

  function toggleTarget(id){
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const before=new Map([...rows].map(([key,row])=>[key,row.getBoundingClientRect()]));
    const row=rows.get(id),btn=row.querySelector('.toggle');
    const next=!state[id];state[id]=next;

    btn.classList.toggle('on',next);btn.setAttribute('aria-checked',String(next));
    fill.style.width=next?'0%':'100%';
    applyOrder();

    if(!reduced){
      requestAnimationFrame(()=>{
        rows.forEach((el,key)=>{
          const first=before.get(key),last=el.getBoundingClientRect();
          const dx=first.left-last.left,dy=first.top-last.top;
          if(Math.abs(dx)>.5||Math.abs(dy)>.5){
            el.animate([{transform:`translate(${dx}px,${dy}px)`,opacity:.72},{transform:'translate(0,0)',opacity:1}],{duration:rowMs,easing:ease});
          }
        });
      });
    }

    const start=performance.now();let seq=(Number(card.dataset.seq)||0)+1;card.dataset.seq=seq;
    readout.textContent=`${next?'Online':'Offline'}へ · 行 ${rowMs}ms / トグル ${TOGGLE_MS}ms`;
    const tick=()=>{
      if(Number(card.dataset.seq)!==seq)return;
      const elapsed=Math.round(performance.now()-start);
      if(elapsed<TOGGLE_MS)requestAnimationFrame(tick);
      else readout.textContent=`完了 · 行 ${rowMs}ms / トグル ${TOGGLE_MS}ms`;
    };
    requestAnimationFrame(tick);
  }

  applyOrder();
  return card;
}

ROW_PRESETS.forEach(ms=>grid.appendChild(buildCard(ms)));
</script>
</body>
</html>
