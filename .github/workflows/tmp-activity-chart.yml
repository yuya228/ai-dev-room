name: Temporary Activity chart patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-activity-chart.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate
        run: |
          python .github/tmp_activity_patch.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          assert s.count('id="activityChart"') == 1
          assert s.count('function loadActivity(') == 1
          assert 'm.archives.filter' in s
          assert "m.progress?.source?.type==='github_issue'" in s
          assert "window.matchMedia('(max-width:980px)').matches" in s
          m = re.search(r'<script>([\s\S]*?)</script>', s)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/ai-dev-room.js').write_text(m.group(1))
          PY
          node --check /tmp/ai-dev-room.js

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: add manifest-driven Activity chart"
          git push
          git rm .github/workflows/tmp-activity-chart.yml .github/tmp_activity_patch.py
          git commit -m "chore: remove temporary Activity patch helpers"
          git push
