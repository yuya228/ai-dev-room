name: Temporary About Rules split retry

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: retry About Rules split' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split About Rules from Settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def sub_once(pattern, repl, flags=0):
              global text
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {pattern[:90]}')
              text = new

          info_icon = '<svg class="hash settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10v6"></path><path d="M12 7h.01"></path></svg>'

          sub_once(r'(<button class="channel" id="desktopSettings">.*?</button>)', r'\1<button class="channel" id="desktopAboutRules">'+info_icon+r'<span>About / Rules</span></button>', re.S)
          sub_once(r'<div class="right-title">この部屋のルール</div><div class="card routine" id="roomRule">.*?</div>', '')
          sub_once(r'(<button class="drawer-setting" id="settingsToggle">.*?</button>)', r'\1<button class="drawer-setting" id="aboutRulesToggle"><span class="settings-label">'+info_icon+r'<span>About / Rules</span></span><span>›</span></button>', re.S)
          sub_once(r'<section class="settings-group"><h2 class="settings-section-title">About / Rules</h2>.*?</section>\n', '', re.S)

          about = '<div class="settings-backdrop" id="aboutRulesBackdrop" aria-hidden="true"><section class="settings-panel" aria-labelledby="aboutRulesTitle"><header class="settings-head"><button class="settings-mobile-menu" id="aboutRulesMobileMenu" aria-label="メニューを開く">☰</button><div><div class="settings-title" id="aboutRulesTitle">About / Rules</div><div class="settings-sub">プライバシー・運用ルール</div></div></header><div class="settings-scroll"><div class="settings-body"><section class="settings-group"><div><div class="settings-rule-row"><strong>プライバシー</strong><span>GitHubに個人情報・認証情報・秘密情報を書き込まない。</span></div><div class="settings-rule-row"><strong>複数チャット運用</strong><span>書き込み直前に最新状態を確認し、他チャットの変更を消さない。</span></div><div class="settings-rule-row"><strong>AI開発ルール</strong><span>Phase境界、narrow fix、Work QAの独立性、最終PASSまでの総コストを優先する。</span></div><div class="settings-rule-row"><strong>Random</strong><span>Workers AIが必要なAIだけ1〜3人選んで反応。複数人ならAI同士でも会話をつなぐ。作業実行はしない。</span></div></div></section></div></div></section></div>\n'
          anchor = '<div class="channel-editor-backdrop" id="channelEditorBackdrop"'
          if text.count(anchor) != 1:
              raise SystemExit('channel editor anchor mismatch')
          text = text.replace(anchor, about + anchor, 1)

          pairs = [
            ("settingsOpen=false,editingMode='channel'", "settingsOpen=false,systemPanel='',editingMode='channel'"),
            ("const drawer=document.getElementById('drawer'),drawerBackdrop=document.getElementById('drawerBackdrop'),settingsBackdrop=document.getElementById('settingsBackdrop'),desktopSettings=document.getElementById('desktopSettings'),settingsToggle=document.getElementById('settingsToggle'),desktopWorkspace=", "const drawer=document.getElementById('drawer'),drawerBackdrop=document.getElementById('drawerBackdrop'),settingsBackdrop=document.getElementById('settingsBackdrop'),aboutRulesBackdrop=document.getElementById('aboutRulesBackdrop'),desktopSettings=document.getElementById('desktopSettings'),settingsToggle=document.getElementById('settingsToggle'),desktopAboutRules=document.getElementById('desktopAboutRules'),aboutRulesToggle=document.getElementById('aboutRulesToggle'),desktopWorkspace="),
            ("function syncNavState(){renderChannelNav();syncCollapsedSections();desktopSettings.classList.toggle('active',settingsOpen);settingsToggle.classList.toggle('active',settingsOpen)}", "function syncNavState(){renderChannelNav();syncCollapsedSections();desktopSettings.classList.toggle('active',settingsOpen&&systemPanel==='settings');settingsToggle.classList.toggle('active',settingsOpen&&systemPanel==='settings');desktopAboutRules.classList.toggle('active',settingsOpen&&systemPanel==='about');aboutRulesToggle.classList.toggle('active',settingsOpen&&systemPanel==='about')}"),
            ("rule.textContent=r.rule;", "if(rule)rule.textContent=r.rule;"),
            ("function openSettings(){closeSearch();closeDrawer();settingsOpen=true;updateSettingsMeta();settingsBackdrop.classList.add('open');settingsBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction closeSettings(){settingsOpen=false;settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');syncNavState()}", "function openSettings(){closeSearch();closeDrawer();settingsOpen=true;systemPanel='settings';aboutRulesBackdrop.classList.remove('open');aboutRulesBackdrop.setAttribute('aria-hidden','true');updateSettingsMeta();settingsBackdrop.classList.add('open');settingsBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction openAboutRules(){closeSearch();closeDrawer();settingsOpen=true;systemPanel='about';settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');aboutRulesBackdrop.classList.add('open');aboutRulesBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction closeSettings(){settingsOpen=false;systemPanel='';settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');aboutRulesBackdrop.classList.remove('open');aboutRulesBackdrop.setAttribute('aria-hidden','true');syncNavState()}"),
            ("document.getElementById('settingsMobileMenu').addEventListener('click',openDrawer);", "document.getElementById('settingsMobileMenu').addEventListener('click',openDrawer);document.getElementById('aboutRulesMobileMenu').addEventListener('click',openDrawer);"),
            ("settingsToggle.addEventListener('click',openSettings);desktopSettings.addEventListener('click',openSettings);desktopWorkspace.addEventListener('click',openWorkspaceEditor);", "settingsToggle.addEventListener('click',openSettings);desktopSettings.addEventListener('click',openSettings);aboutRulesToggle.addEventListener('click',openAboutRules);desktopAboutRules.addEventListener('click',openAboutRules);desktopWorkspace.addEventListener('click',openWorkspaceEditor);"),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'JS target mismatch: {old[:90]} count={text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['id="desktopAboutRules"','id="aboutRulesToggle"','id="aboutRulesBackdrop"','<strong>Random</strong>',"systemPanel='about'",'function openAboutRules()']
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing {marker}')
          if 'この部屋のルール' in text:
              raise SystemExit('rightbar rule still present')
          if '<h2 class="settings-section-title">About / Rules</h2>' in text:
              raise SystemExit('About / Rules still nested in Settings')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: split About Rules from Settings'
          git push origin HEAD:main
