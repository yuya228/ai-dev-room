name: Temporary Issue status normalization patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-status-normalize-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Issue status normalization
        run: python .github/tmp-status-normalize-20260905.py
      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser): pass
          P().feed(text)
          assert text.count("const ISSUE_STATUSES=['START','NEXT','PASS','FAIL','FIX','BLOCKED','WAITING','CLOSED','COST'];") == 1
          assert text.count('function normalizeIssueStatus(status)') == 1
          assert text.count('function issueDisplayTags(tags)') == 1
          assert text.count('その他はLOGとして表示。') == 1
          assert text.count('.log{color:#bcb5c4') == 1
          # The legacy Phase 1 source data stays untouched; rendering normalizes it.
          assert "[['PHASE 1','review'],['START','review']]" in text
          # Quick model of display policy: first exact official status, otherwise LOG.
          official=['START','NEXT','PASS','FAIL','FIX','BLOCKED','WAITING','CLOSED','COST']
          def norm(tags):
              for t in tags:
                  s=t.strip().upper()
                  if s in official: return s
              return 'LOG' if tags else None
          assert norm(['PHASE 1','START']) == 'START'
          assert norm(['IMPLEMENTED']) == 'LOG'
          assert norm(['FAIL','HIGH']) == 'FAIL'
          assert norm(['FAIL','BLOCKED']) == 'FAIL'
          assert norm(['BASELINE','COST']) == 'COST'
          assert norm(['M-06 CLOSED','H/M 0/0']) == 'LOG'
          # JS syntax check input extraction happens in next step.
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          assert scripts
          Path('/tmp/aidevroom-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Issue status normalization static validation PASS')
          PY
          node --check /tmp/aidevroom-inline.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
            exit 1
          fi
          git commit -m 'fix: normalize Issue status tags in archives'
          git push origin HEAD:main
