name: Temporary mobile progress midpoint 60

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run temporary mobile progress midpoint 60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set mobile progress midpoint to 60 percent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.drawer-progress .bar span{background-image:linear-gradient(90deg,#4b42ff 0%,#8d52ff 55%,#d96dff 100%)}'
          new = '.drawer-progress .bar span{background-image:linear-gradient(90deg,#4b42ff 0%,#8d52ff 60%,#d96dff 100%)}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one mobile 55% rule, found {s.count(old)}')
          desktop = 'background:linear-gradient(90deg,#4b42ff 0%,#8d52ff 50%,#d96dff 100%)'
          if s.count(desktop) != 1:
              raise SystemExit(f'expected exactly one desktop 50% rule, found {s.count(desktop)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -F '.drawer-progress .bar span{background-image:linear-gradient(90deg,#4b42ff 0%,#8d52ff 60%,#d96dff 100%)}' index.html
          grep -F 'background:linear-gradient(90deg,#4b42ff 0%,#8d52ff 50%,#d96dff 100%)' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: tune mobile progress gradient to 60 percent'
          git push origin main
          rm .github/workflows/tmp-mobile-progress-midpoint-60.yml
          git add .github/workflows/tmp-mobile-progress-midpoint-60.yml
          git commit -m 'chore: remove temporary mobile progress 60 runner'
          git push origin main
