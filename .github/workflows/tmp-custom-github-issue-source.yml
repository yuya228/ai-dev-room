name: Temporary Custom GitHub Issue source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'fix: rerun custom Issue patch helper' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch custom GitHub Issue channels
        run: python .github/tmp-custom-github-issue-run.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="channelSourceInput"',
              'function parseGitHubIssueUrl(value)',
              'function loadCustomIssueChannel(ch,force=false)',
              'function loadOlderCustomIssue(ch)',
              "cache:r.messages.slice(-100)",
              'keeping previous-good cache',
              "rooms[current]?.type==='custom'&&rooms[current]?.sourceUrl",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          if text.count('id="channelSourceInput"') != 1:
              raise SystemExit('duplicate source input')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js
          node - <<'NODE'
          function parseGitHubIssueUrl(value){try{const u=new URL(String(value||'').trim());if(u.protocol!=='https:'||u.hostname!=='github.com'||u.search||u.hash)return null;const m=u.pathname.match(/^\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)\/issues\/(\d+)\/?$/);if(!m)return null;const issue=Number(m[3]);if(!Number.isSafeInteger(issue)||issue<1)return null;return{owner:m[1],repo:m[2],issue,url:`https://github.com/${m[1]}/${m[2]}/issues/${issue}`}}catch{return null}}
          const valid=parseGitHubIssueUrl('https://github.com/yuya228/ai-dev-room/issues/2');
          if(!valid||valid.owner!=='yuya228'||valid.repo!=='ai-dev-room'||valid.issue!==2)process.exit(1);
          for(const bad of ['http://github.com/a/b/issues/1','https://example.com/a/b/issues/1','https://github.com/a/b/pull/1','https://github.com/a/b/issues/1?x=1'])if(parseGitHubIssueUrl(bad))process.exit(2);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: connect custom channels to GitHub Issues'
          git push origin HEAD:main
