name: tmp-phase1-cost-edit

on:
  push:
    paths:
      - '.github/workflows/tmp-phase1-cost-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Phase 1 accounting summary
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Phase 1を今後の比較baselineとして確定します。Phase 2では実装・修正・Work初回レビュー・再レビューを分け、最終PASSまでの総クレジットで比較します。'
          new = 'Phase 1はPASS / COMPLETE。最終累計は約600/100です。未記録分を含む概算値として、Phase 2以降のコスト比較baselineにします。'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'AI経理'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'docs: update Phase 1 cost summary'
          git push origin HEAD:main
