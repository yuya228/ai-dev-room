name: Phase 4 progress label narrow fix
on:
  push:
    paths:
      - '.github/workflows/tmp-phase4-progress-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only progress Phase labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<aside class="rightbar"><div class="right-title">Phase 2</div>'
          new1 = '<aside class="rightbar"><div class="right-title">Phase 4</div>'
          old2 = '<span class="drawer-progress-title">Phase 2 Progress</span>'
          new2 = '<span class="drawer-progress-title">Phase 4 Progress</span>'
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify narrow scope
        shell: bash
        run: |
          grep -F '<aside class="rightbar"><div class="right-title">Phase 4</div>' index.html
          grep -F '<span class="drawer-progress-title">Phase 4 Progress</span>' index.html
          git diff --check
          git diff -- index.html
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Phase 4 in progress labels'
          git push
          git rm .github/workflows/tmp-phase4-progress-label.yml
          git commit -m 'Remove temporary Phase 4 label helper'
          git push
