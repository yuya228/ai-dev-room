name: Temporary desktop progress value size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-desktop-progress-value-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge desktop progress value only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.metric strong{font-size:11px}.progress-percent{font-family:Arial,sans-serif;font-weight:700}'
          new = '.metric strong{font-size:11px}#desktopProgressValue{font-size:16px}.progress-percent{font-family:Arial,sans-serif;font-weight:700}'
          if s.count(old) != 1:
              raise SystemExit(f'expected desktop progress CSS anchor exactly once, found {s.count(old)}')
          if '#desktopProgressValue{font-size:16px}' in s:
              raise SystemExit('desktop progress size rule already exists')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -F '#desktopProgressValue{font-size:16px}' index.html
          grep -F '.drawer-progress-value{font-size:19px;font-weight:900}' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: enlarge desktop progress value'
          git push origin main
          rm .github/workflows/tmp-desktop-progress-value-size.yml
          git add .github/workflows/tmp-desktop-progress-value-size.yml
          git commit -m 'chore: remove temporary desktop progress runner'
          git push origin main
