name: Temporary native status tag patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-status-guide-native-tags.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch native status tags
        run: python .github/tmp-status-guide-native-tags.py
      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser): pass
          P().feed(text)
          assert text.count('class="status-guide-list"') == 1
          assert 'status-guide-icon' not in text
          assert 'status-guide-card' not in text
          expected = {
              'START':'review','NEXT':'review','PASS':'done','FAIL':'blocked',
              'FIX':'done','BLOCKED':'blocked','WAITING':'review','CLOSED':'done','COST':'cost'
          }
          for label, cls in expected.items():
              marker=f'<span class="tag {cls}">{label}</span>'
              assert text.count(marker) == 1, (marker, text.count(marker))
          print('native status tag UI validation PASS')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
            exit 1
          fi
          git commit -m 'style: reuse message status tags in About Rules'
          git push origin HEAD:main
