name: Temporary Progress default and gradient

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary progress-default gradient' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Progress default and gradient
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("let current='chat',busy=false", "let current='progress',busy=false"),
              ("if(typeof saved?.current==='string'&&rooms[saved.current])current=saved.current;", ""),
              (".bar span{display:block;height:100%;width:18%;background:var(--accent);transition:width .25s ease}", ".bar span{display:block;height:100%;width:18%;background:linear-gradient(90deg,#7c5cff,#a764ff);transition:width .25s ease}"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "let current='progress',busy=false",
              ".bar span{display:block;height:100%;width:18%;background:linear-gradient(90deg,#7c5cff,#a764ff);transition:width .25s ease}",
          ]
          for marker in required:
              if text.count(marker) != 1:
                  raise SystemExit(f'validation failed: {marker}')
          if "if(typeof saved?.current==='string'&&rooms[saved.current])current=saved.current;" in text:
              raise SystemExit('saved channel still overrides Progress startup')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: open Progress by default and gradient progress bar'
          git push origin HEAD:main
