name: Temporary Phase1 status compatibility patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-phase1-status-compat-20260905.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Phase1 legacy status aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function legacyStatusFromTags(tags){const list=Array.isArray(tags)?tags:[];if(!list.length)return'LOG';for(const t of list){const s=String(t?.[0]||'').trim().toUpperCase();if(ISSUE_STATUSES.includes(s))return s}const priority=['CLOSED','BLOCKED','FAIL','FIX','WAITING','PASS','START','NEXT','COST'];for(const wanted of priority){for(const t of list){const words=String(t?.[0]||'').trim().toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);if(words.includes(wanted))return wanted}}return'LOG'}"
          new="function legacyStatusFromTags(tags){const list=Array.isArray(tags)?tags:[];if(!list.length)return'LOG';for(const t of list){const s=String(t?.[0]||'').trim().toUpperCase();if(ISSUE_STATUSES.includes(s))return s}const aliases={'IMPLEMENTED':'PASS','NARROW ONLY':'NEXT','CONDITIONAL':'BLOCKED','M-02':'BLOCKED','LOCAL ONLY':'WAITING','M-06 REOPEN':'BLOCKED'};for(const t of list){const s=String(t?.[0]||'').trim().toUpperCase();if(aliases[s])return aliases[s];if(/^R\\d+$/.test(s))return'FIX'}const priority=['CLOSED','BLOCKED','FAIL','FIX','WAITING','PASS','START','NEXT','COST'];for(const wanted of priority){for(const t of list){const words=String(t?.[0]||'').trim().toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);if(words.includes(wanted))return wanted}}return'LOG'}"
          if s.count(old)!=1: raise SystemExit(f'target count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ["'IMPLEMENTED':'PASS'","'NARROW ONLY':'NEXT'","'CONDITIONAL':'BLOCKED'","'M-02':'BLOCKED'","'LOCAL ONLY':'WAITING'","'M-06 REOPEN':'BLOCKED'","/^R\\d+$/.test(s)"]:
            assert x in s, x
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/aidevroom-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          # Model all built-in Phase1 legacy tag groups: none should remain LOG.
          official={'START','NEXT','PASS','FAIL','FIX','BLOCKED','WAITING','CLOSED','COST'}
          aliases={'IMPLEMENTED':'PASS','NARROW ONLY':'NEXT','CONDITIONAL':'BLOCKED','M-02':'BLOCKED','LOCAL ONLY':'WAITING','M-06 REOPEN':'BLOCKED'}
          groups=[['PHASE 1','START'],['IMPLEMENTED'],['LOCAL PASS','GATE PENDING'],['WAITING REVIEW'],['FAIL','HIGH'],['NARROW ONLY'],['HIGH FIX','LOCAL PASS'],['FAIL','BLOCKED'],['NARROW FIX'],['R4','PASS'],['CONDITIONAL','M-02'],['R5','LOCAL ONLY'],['GATE','PASS'],['M-06 REOPEN','CONDITIONAL'],['M-06 FIX'],['M-06 CLOSED','H/M 0/0'],['V143','GATE PASS'],['IPHONE','PASS'],['PHASE 1 PASS','READY'],['BASELINE','COST']]
          def norm(tags):
            for t in tags:
              u=t.upper()
              if u in official:return u
            for t in tags:
              u=t.upper()
              if u in aliases:return aliases[u]
              if re.fullmatch(r'R\\d+',u):return 'FIX'
            for wanted in ['CLOSED','BLOCKED','FAIL','FIX','WAITING','PASS','START','NEXT','COST']:
              for t in tags:
                if wanted in [w for w in re.split(r'[^A-Z0-9]+',t.upper()) if w]:return wanted
            return 'LOG'
          result=[norm(g) for g in groups]
          assert 'LOG' not in result, result
          print(result)
          PY
          node --check /tmp/aidevroom-inline.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: complete Phase1 legacy status mapping'
          git push origin HEAD:main
