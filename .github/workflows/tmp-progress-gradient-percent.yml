name: Temporary progress gradient percent polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary progress gradient percent polish' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved progress polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.metric strong{font-size:11px}',
                  '.metric strong{font-size:11px}.progress-percent{font-family:Arial,sans-serif;font-weight:700}'
              ),
              (
                  'background:linear-gradient(90deg,#5c46ff,#c06cff);background-repeat:no-repeat;background-position:left center;transition:width .25s ease,background-size .25s ease',
                  'background:linear-gradient(90deg,#4b42ff 0%,#8d52ff 30%,#d96dff 100%);background-repeat:no-repeat;background-position:left center;transition:width .25s ease,background-size .25s ease'
              ),
              (
                  '<strong id="desktopProgressValue">18%</strong>',
                  '<strong id="desktopProgressValue">18<span class="progress-percent">%</span></strong>'
              ),
              (
                  '<strong class="drawer-progress-value" id="drawerProgressValue">18%</strong>',
                  '<strong class="drawer-progress-value" id="drawerProgressValue">18<span class="progress-percent">%</span></strong>'
              ),
              (
                  "function syncProgressUI(){const v=clampProgress(phaseProgress),text=`${v}%`;for(const id of ['drawerProgressValue','desktopProgressValue']){const el=document.getElementById(id);if(el)el.textContent=text}for(const id of ['drawerProgressBar','desktopProgressBar']){const el=document.getElementById(id);if(el){el.style.width=text;el.style.backgroundSize=v?`${10000/v}% 100%`:'100% 100%'}}}",
                  "function syncProgressUI(){const v=clampProgress(phaseProgress),text=`${v}%`;for(const id of ['drawerProgressValue','desktopProgressValue']){const el=document.getElementById(id);if(el)el.innerHTML=`${v}<span class=\"progress-percent\">%</span>`}for(const id of ['drawerProgressBar','desktopProgressBar']){const el=document.getElementById(id);if(el){el.style.width=text;el.style.backgroundSize=v?`${10000/v}% 100%`:'100% 100%'}}}"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'target count={count}: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -F '.progress-percent{font-family:Arial,sans-serif;font-weight:700}' index.html
          grep -F 'linear-gradient(90deg,#4b42ff 0%,#8d52ff 30%,#d96dff 100%)' index.html
          grep -F 'id="drawerProgressValue">18<span class="progress-percent">%</span>' index.html
          grep -F 'id="desktopProgressValue">18<span class="progress-percent">%</span>' index.html

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('no inline scripts found')
          Path('/tmp/inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js

      - name: Commit change and remove runner
        shell: bash
        run: |
          rm .github/workflows/tmp-progress-gradient-percent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/tmp-progress-gradient-percent.yml
          git commit -m 'style: refine progress gradient and percent'
          git push origin HEAD:main
