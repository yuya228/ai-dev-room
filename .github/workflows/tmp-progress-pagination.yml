name: Temporary Progress pagination

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'fix: repair temporary Progress pagination runner' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Progress pagination and previous-good cache
        shell: bash
        env:
          REPLACEMENT_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              text = text.replace(old, new, 1)

          replace_once("const PROGRESS_API='https://api.github.com/repos/yuya228/ai-dev-room/issues/2/comments?per_page=100';", "const PROGRESS_API='https://api.github.com/repos/yuya228/ai-dev-room/issues/2/comments';", 'progress API base')
          replace_once("progressLoading=false,lastProgressFetch=0", "progressLoading=false,progressLoadingOlder=false,progressInitialized=false,progressNewestPage=1,progressOldestPage=1,progressHasOlder=false,progressOlderBuffer=[],progressSyncError='',lastProgressFetch=0", 'progress state')
          replace_once("if(saved?.progressKnownId!=null)progressKnownId=String(saved.progressKnownId)", "if(saved?.progressKnownId!=null)progressKnownId=String(saved.progressKnownId);if(Array.isArray(saved?.progressCache))rooms.progress.messages=saved.progressCache.slice(-100)", 'previous-good restore')
          replace_once("customChannels:customChannelItems(),unreadCounts,progressKnownId}))", "customChannels:customChannelItems(),unreadCounts,progressKnownId,progressCache:rooms.progress.messages.slice(-100)}))", 'previous-good persist')
          replace_once("{actor,recordedBy,source,progress}]}", "{actor,recordedBy,source,progress,commentId:String(c?.id||'')}]}", 'comment id metadata')
          replace_once("note.textContent=progressLoading?'canonicalログを同期中…':'書き込み: Phase統括（3役代理） / AI経理 → Issue #2';", "note.textContent=progressLoading?'canonicalログを同期中…':progressSyncError?'同期エラー · 前回正常データを表示中':'書き込み: Phase統括（3役代理） / AI経理 → Issue #2';", 'previous-good status')
          replace_once("function syncFeedScrollState(){syncJumpBottom();if(isFeedAtBottom())markRead(current)}", "function syncFeedScrollState(){syncJumpBottom();if(isFeedAtBottom())markRead(current);if(current==='progress'&&feed.scrollTop<=80)loadOlderProgress()}", 'top-scroll loader hook')

          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          pattern = r"async function loadCanonicalProgress\(force=false\)\{.*?\}\nconst sleep="
          text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'loadCanonicalProgress replacement: expected 1, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Validate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "const PROGRESS_API='https://api.github.com/repos/yuya228/ai-dev-room/issues/2/comments';",
              "function loadOlderProgress()",
              "progressCache:rooms.progress.messages.slice(-100)",
              "if(current==='progress'&&feed.scrollTop<=80)loadOlderProgress()",
              "keeping previous-good cache",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          if "rooms.progress.messages=[['system',`canonical同期エラー:" in text:
              raise SystemExit('destructive error replacement still present')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: paginate Progress history safely'
          git push origin HEAD:main
