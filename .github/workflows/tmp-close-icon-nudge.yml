name: Temporary close icon nudge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  nudge:
    if: "${{ github.event.head_commit.message == 'chore: run temporary close icon nudge' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nudge close icon down slightly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'padding:0 0 3px}.drawer-progress'
          new = 'padding:0 0 2px}.drawer-progress'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: fine-tune drawer close icon alignment'
          git push origin HEAD:main
