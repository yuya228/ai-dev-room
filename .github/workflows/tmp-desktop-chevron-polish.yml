name: Temporary desktop chevron polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-desktop-chevron-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish desktop chevrons only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '@media(min-width:721px){.section-toggle .chevron{font-size:18px}'
          new = '@media(min-width:721px){.section-toggle .chevron{position:relative;width:18px;height:18px;font-size:0}.section-toggle .chevron::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}'
          if s.count(old) != 1:
              raise SystemExit(f'expected desktop chevron override exactly once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F '@media(min-width:721px){.section-toggle .chevron{position:relative;width:18px;height:18px;font-size:0}' index.html
          grep -F '.section-toggle .chevron::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}' index.html
          grep -F '.chevron{display:inline-block;font-size:16px;font-weight:750;color:#8f8798;line-height:1}' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: polish desktop chevrons'
          git push origin main
          rm .github/workflows/tmp-desktop-chevron-polish.yml
          git add .github/workflows/tmp-desktop-chevron-polish.yml
          git commit -m 'chore: remove temporary desktop chevron runner'
          git push origin main
