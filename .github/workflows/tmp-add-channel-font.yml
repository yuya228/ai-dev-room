name: Temporary add channel font tweak

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary add-channel font tweak' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set add-channel label font size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.add-channel .add-label,.drawer-add-channel .add-label{font-size:11px;font-weight:700}'
          new = '.add-channel .add-label,.drawer-add-channel .add-label{font-size:13px;font-weight:700}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -Fq '.add-channel .add-label,.drawer-add-channel .add-label{font-size:13px;font-weight:700}' index.html
      - name: Commit font tweak
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: enlarge add-channel label'
          git push origin HEAD:main
