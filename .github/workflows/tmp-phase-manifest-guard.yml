name: Temporary Phase manifest guard

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary phase manifest guard patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen manifest fail-closed guards
        run: python .github/tmp-phase-manifest-guard.py

      - name: Validate
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            "p>=phase",
            "archives.length!==Math.max(0,phase-1)",
            "a.source.url===progressInfo.url",
            "policy?.requiresExplicitUserApproval!==true",
            "executor:'Phase統括'",
            "browserWriteAccess:false",
          ]
          for marker in required:
              if marker not in text: raise SystemExit(f'missing {marker}')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: fail closed on invalid Phase manifest'
          git push origin HEAD:main
