name: Temporary legacy status compatibility patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run temporary legacy status compat patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch legacy statuses
        run: python .github/tmp-legacy-status-compat-20260905.py
      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert "LEGACY_STATUS_CUTOFF='2026-09-05 01:38 JST'" in text
          assert 'function legacyStatusFromTags' in text
          assert 'function normalizeCanonicalStatus' in text
          assert "actor==='AI経理'&&s==='LOG'" in text
          assert "if(s==='DONE')return'PASS'" in text
          assert "if(s==='IN_PROGRESS')return'START'" in text
          assert "status=normalizeCanonicalStatus(header?.[3]||'LOG',actor,header?.[1])" in text
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',text,re.I)
          assert scripts
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: preserve legacy Phase status meaning' || exit 0
          git push
