name: Temporary align add channel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary add-channel alignment' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align add-channel buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.add-channel{justify-content:center;color:#8f8798;padding:5px 10px 7px;min-height:34px}',
                  '.add-channel{justify-content:flex-start;color:#8f8798;padding:5px 10px 7px;min-height:34px}'
              ),
              (
                  '.drawer-add-channel{justify-content:center;color:#8f8798;padding:5px 9px 7px;min-height:34px}',
                  '.drawer-add-channel{justify-content:flex-start;color:#8f8798;padding:5px 9px 7px;min-height:34px}'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '.add-channel{justify-content:flex-start;color:#8f8798;padding:5px 10px 7px;min-height:34px}',
              '.drawer-add-channel{justify-content:flex-start;color:#8f8798;padding:5px 9px 7px;min-height:34px}',
          ]
          for marker in required:
              if text.count(marker) != 1:
                  raise SystemExit(f'validation failed: {marker}')
          if '.add-channel{justify-content:center;color:#8f8798' in text:
              raise SystemExit('desktop add-channel is still centered')
          if '.drawer-add-channel{justify-content:center;color:#8f8798' in text:
              raise SystemExit('mobile add-channel is still centered')
          PY

      - name: Commit alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: align add-channel labels left'
          git push origin HEAD:main
