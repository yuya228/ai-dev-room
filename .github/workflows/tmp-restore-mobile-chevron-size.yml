name: Temporary restore mobile chevron size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-restore-mobile-chevron-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore mobile chevron size only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.chevron{display:inline-block;font-size:14px;font-weight:750;color:#8f8798;line-height:1}'
          new = '.chevron{display:inline-block;font-size:16px;font-weight:750;color:#8f8798;line-height:1}'
          desktop = '.section-toggle .chevron::before{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}'
          if s.count(old) != 1:
              raise SystemExit(f'expected mobile/shared chevron rule once, found {s.count(old)}')
          if s.count(desktop) != 1:
              raise SystemExit(f'expected desktop 7px chevron rule once, found {s.count(desktop)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F '.chevron{display:inline-block;font-size:16px' index.html
          grep -F 'left:5px;top:5px;width:7px;height:7px' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: keep mobile chevrons at original size'
          git push origin main
          rm .github/workflows/tmp-restore-mobile-chevron-size.yml
          git add .github/workflows/tmp-restore-mobile-chevron-size.yml
          git commit -m 'chore: remove temporary mobile chevron restore runner'
          git push origin main
