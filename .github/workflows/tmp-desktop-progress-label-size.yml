name: Temporary desktop progress label size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-desktop-progress-label-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge desktop Progress label only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.metric{display:flex;justify-content:space-between;font-size:10px;margin:8px 0}.metric strong{font-size:11px}#desktopProgressValue{font-size:16px}.progress-percent'
          new = '.metric{display:flex;justify-content:space-between;font-size:10px;margin:8px 0}.metric strong{font-size:11px}#desktopProgressValue{font-size:16px}.rightbar .metric>span{font-size:13px}.progress-percent'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected target exactly once, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F '#desktopProgressValue{font-size:16px}.rightbar .metric>span{font-size:13px}' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: enlarge desktop progress label'
          git push origin main
          rm .github/workflows/tmp-desktop-progress-label-size.yml
          git add .github/workflows/tmp-desktop-progress-label-size.yml
          git commit -m 'chore: remove temporary desktop progress label runner'
          git push origin main
