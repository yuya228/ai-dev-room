name: Temporary chevron size tweak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chevrons-smaller.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce chevron size only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_mobile = '.chevron{display:inline-block;font-size:16px;font-weight:750;color:#8f8798;line-height:1}'
          new_mobile = '.chevron{display:inline-block;font-size:14px;font-weight:750;color:#8f8798;line-height:1}'
          old_desktop = '@media(min-width:721px){.section-toggle .chevron{position:relative;width:18px;height:18px;font-size:0}.section-toggle .chevron::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}'
          new_desktop = '@media(min-width:721px){.section-toggle .chevron{position:relative;width:18px;height:18px;font-size:0}.section-toggle .chevron::before{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}'

          if s.count(old_mobile) != 1:
              raise SystemExit(f'expected shared chevron rule once, found {s.count(old_mobile)}')
          if s.count(old_desktop) != 1:
              raise SystemExit(f'expected desktop chevron rule once, found {s.count(old_desktop)}')

          s = s.replace(old_mobile, new_mobile, 1)
          s = s.replace(old_desktop, new_desktop, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F '.chevron{display:inline-block;font-size:14px' index.html
          grep -F 'left:5px;top:5px;width:7px;height:7px' index.html

      - name: Commit change and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: reduce chevron size'
          git push origin main
          rm .github/workflows/tmp-chevrons-smaller.yml
          git add .github/workflows/tmp-chevrons-smaller.yml
          git commit -m 'chore: remove temporary chevron runner'
          git push origin main
