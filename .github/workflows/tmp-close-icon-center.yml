name: Temporary close icon center fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'chore: run temporary close icon center fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace glyph with centered CSS cross
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.drawer-close{width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.05);font-size:18px;display:grid;place-items:center;line-height:1;padding:0 0 2px}'
          new = '.drawer-close{position:relative;width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.05);font-size:0;padding:0}.drawer-close::before,.drawer-close::after{content:"";position:absolute;top:50%;left:50%;width:13px;height:1.5px;border-radius:999px;background:currentColor;transform-origin:center}.drawer-close::before{transform:translate(-50%,-50%) rotate(45deg)}.drawer-close::after{transform:translate(-50%,-50%) rotate(-45deg)}'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code --quiet -- index.html && { echo 'No change produced'; exit 1; } || true
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: center drawer close icon geometrically'
          git push origin HEAD:main
