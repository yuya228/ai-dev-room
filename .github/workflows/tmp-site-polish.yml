name: Temporary site polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary site polish' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          once(
              '.add-channel{justify-content:center;color:#8f8798;padding:5px 10px 7px;min-height:34px}.add-channel .plus{font-size:19px;line-height:1}.settings-label{display:flex;align-items:center;gap:9px}',
              '.add-channel{justify-content:center;color:#8f8798;padding:5px 10px 7px;min-height:34px}.add-channel .plus{font-size:19px;line-height:1}.add-channel .add-label,.drawer-add-channel .add-label{font-size:11px;font-weight:700}.channel-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unread-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:850;line-height:1;flex:0 0 auto}.settings-label{display:flex;align-items:center;gap:9px}'
          )

          once(
              '@media(max-width:980px){.app{grid-template-columns:220px minmax(0,1fr)}.rightbar{display:none}.settings-backdrop{left:220px;right:0}}',
              '@media(min-width:721px){.feed,.rightbar,.settings-scroll{scrollbar-width:thin;scrollbar-color:#3b3642 transparent}.feed::-webkit-scrollbar,.rightbar::-webkit-scrollbar,.settings-scroll::-webkit-scrollbar{width:7px}.feed::-webkit-scrollbar-track,.rightbar::-webkit-scrollbar-track,.settings-scroll::-webkit-scrollbar-track{background:transparent}.feed::-webkit-scrollbar-thumb,.rightbar::-webkit-scrollbar-thumb,.settings-scroll::-webkit-scrollbar-thumb{background:#3b3642;border-radius:999px;border:2px solid transparent;background-clip:padding-box}.feed::-webkit-scrollbar-thumb:hover,.rightbar::-webkit-scrollbar-thumb:hover,.settings-scroll::-webkit-scrollbar-thumb:hover{background:#514a59;background-clip:padding-box}}\n@media(max-width:980px){.app{grid-template-columns:220px minmax(0,1fr)}.rightbar{display:none}.settings-backdrop{left:220px;right:0}}'
          )

          once(
              '<button class="add-channel" id="desktopAddChannel" aria-label="チャンネルを追加"><span class="plus">＋</span></button>',
              '<button class="add-channel" id="desktopAddChannel" aria-label="チャンネルを追加"><span class="plus">＋</span><span class="add-label">チャンネルを追加</span></button>'
          )
          once(
              '<button class="drawer-add-channel" id="drawerAddChannel" aria-label="チャンネルを追加"><span class="plus">＋</span></button>',
              '<button class="drawer-add-channel" id="drawerAddChannel" aria-label="チャンネルを追加"><span class="plus">＋</span><span class="add-label">チャンネルを追加</span></button>'
          )

          once(
              "let current='chat',busy=false,progressLoading=false,lastProgressFetch=0,phaseProgress=18,settingsOpen=false,editingMode='channel',editingChannel='',editingNewChannel=false,stableAppHeight=Math.round(window.innerHeight||document.documentElement.clientHeight||0),viewportLockUntil=0;",
              "let current='chat',busy=false,progressLoading=false,lastProgressFetch=0,phaseProgress=18,settingsOpen=false,editingMode='channel',editingChannel='',editingNewChannel=false,stableAppHeight=Math.round(window.innerHeight||document.documentElement.clientHeight||0),viewportLockUntil=0,unreadCounts={},progressKnownId='';"
          )

          once(
              "if(typeof saved?.current==='string'&&rooms[saved.current])current=saved.current}catch(e){console.warn('Saved chat could not be loaded',e)}",
              "if(typeof saved?.current==='string'&&rooms[saved.current])current=saved.current;if(saved?.unreadCounts&&typeof saved.unreadCounts==='object'){for(const [ch,count] of Object.entries(saved.unreadCounts)){const n=Math.max(0,Math.floor(Number(count)||0));if(n)unreadCounts[ch]=n}}if(saved?.progressKnownId!=null)progressKnownId=String(saved.progressKnownId)}catch(e){console.warn('Saved chat could not be loaded',e)}"
          )

          once(
              "function saveState(){try{const channels={};for(const ch of ['chat','phase1','progress'])channels[ch]={name:rooms[ch].name,desc:rooms[ch].desc};localStorage.setItem(STORAGE_KEY,JSON.stringify({version:9,current,workspace:{name:workspaceMeta.name,sub:workspaceMeta.sub},rooms:{chat:{messages:rooms.chat.messages.slice(-200)}},channels,customChannels:customChannelItems()}))}catch(e){console.warn('Chat save failed',e)}}",
              "function saveState(){try{const channels={};for(const ch of ['chat','phase1','progress'])channels[ch]={name:rooms[ch].name,desc:rooms[ch].desc};localStorage.setItem(STORAGE_KEY,JSON.stringify({version:9,current,workspace:{name:workspaceMeta.name,sub:workspaceMeta.sub},rooms:{chat:{messages:rooms.chat.messages.slice(-200)}},channels,customChannels:customChannelItems(),unreadCounts,progressKnownId}))}catch(e){console.warn('Chat save failed',e)}}"
          )

          once(
              "function pushChat(entry){rooms.chat.messages.push(entry);if(rooms.chat.messages.length>200)rooms.chat.messages=rooms.chat.messages.slice(-200);saveState()}",
              "function isFeedAtBottom(){return feed.scrollHeight-feed.scrollTop-feed.clientHeight<=24}\nfunction isChannelVisibleAtBottom(ch){return ch===current&&!settingsOpen&&isFeedAtBottom()}\nfunction markRead(ch){if(!unreadCounts[ch])return;delete unreadCounts[ch];saveState();renderChannelNav()}\nfunction pushChat(entry,incoming=false){rooms.chat.messages.push(entry);if(rooms.chat.messages.length>200)rooms.chat.messages=rooms.chat.messages.slice(-200);if(incoming&&!isChannelVisibleAtBottom('chat'))unreadCounts.chat=(unreadCounts.chat||0)+1;saveState();if(incoming)renderChannelNav()}"
          )

          once(
              "function renderChannelNav(){const ids=channelOrder(),desktop=document.getElementById('desktopChannels'),mobile=document.getElementById('drawerChannels');desktop.innerHTML=ids.map(ch=>`<button class=\"channel${!settingsOpen&&ch===current?' active':''}\" data-ch=\"${esc(ch)}\"><span class=\"hash\">#</span><span>${esc(normalizedRoomName(ch))}</span></button>`).join('');mobile.innerHTML=ids.map(ch=>`<button class=\"drawer-channel${!settingsOpen&&ch===current?' active':''}\" data-ch=\"${esc(ch)}\"><span class=\"hash\">#</span><span>${esc(normalizedRoomName(ch))}</span></button>`).join('')}",
              "function unreadBadge(ch){const n=Math.max(0,Math.floor(Number(unreadCounts[ch])||0));return n?`<span class=\"unread-badge\" aria-label=\"未読 ${n}件\">${n>99?'99+':n}</span>`:''}\nfunction renderChannelNav(){const ids=channelOrder(),desktop=document.getElementById('desktopChannels'),mobile=document.getElementById('drawerChannels');desktop.innerHTML=ids.map(ch=>`<button class=\"channel${!settingsOpen&&ch===current?' active':''}\" data-ch=\"${esc(ch)}\"><span class=\"hash\">#</span><span class=\"channel-name\">${esc(normalizedRoomName(ch))}</span>${unreadBadge(ch)}</button>`).join('');mobile.innerHTML=ids.map(ch=>`<button class=\"drawer-channel${!settingsOpen&&ch===current?' active':''}\" data-ch=\"${esc(ch)}\"><span class=\"hash\">#</span><span class=\"channel-name\">${esc(normalizedRoomName(ch))}</span>${unreadBadge(ch)}</button>`).join('')}"
          )

          once(
              "function syncJumpBottom(){const distance=feed.scrollHeight-feed.scrollTop-feed.clientHeight;jumpBottom.classList.toggle('visible',distance>72)}",
              "function syncJumpBottom(){const distance=feed.scrollHeight-feed.scrollTop-feed.clientHeight;jumpBottom.classList.toggle('visible',distance>72)}\nfunction syncFeedScrollState(){syncJumpBottom();if(isFeedAtBottom())markRead(current)}"
          )

          once(
              'function render(){const r=rooms[current];',
              'function render(preserveScroll=false){const oldTop=feed.scrollTop,stickToBottom=!preserveScroll||isFeedAtBottom(),r=rooms[current];'
          )
          once(
              'requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;syncJumpBottom()});syncWorkspaceLabels();',
              'requestAnimationFrame(()=>{feed.scrollTop=stickToBottom?feed.scrollHeight:oldTop;syncJumpBottom();if(isFeedAtBottom())markRead(current)});syncWorkspaceLabels();'
          )

          pattern = r"async function loadCanonicalProgress\(force=false\)\{.*?\}\nconst sleep="
          replacement = """async function loadCanonicalProgress(force=false){if(progressLoading)return;if(!force&&Date.now()-lastProgressFetch<30000&&rooms.progress.messages.length)return;progressLoading=true;if(current==='progress'&&!settingsOpen)render(true);try{const res=await fetch(PROGRESS_API,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!res.ok)throw new Error(`GitHub HTTP ${res.status}`);const data=await res.json(),next=Array.isArray(data)?data.map(parseCanonical):[],latestId=Array.isArray(data)&&data.length?String(data[data.length-1]?.id||''):'';let added=0,knownChanged=false;if(latestId){if(!progressKnownId){progressKnownId=latestId;knownChanged=true}else if(latestId!==progressKnownId){const prevIndex=data.findIndex(c=>String(c?.id||'')===progressKnownId);added=prevIndex>=0?Math.max(0,data.length-prevIndex-1):0;progressKnownId=latestId;knownChanged=true}}rooms.progress.messages=next;for(const m of rooms.progress.messages){const p=m?.[4]?.progress;if(m?.[4]?.actor==='Phase統括'&&Number.isFinite(p))phaseProgress=p}if(added&&!isChannelVisibleAtBottom('progress'))unreadCounts.progress=(unreadCounts.progress||0)+added;if(knownChanged||added)saveState();if(added)renderChannelNav();lastProgressFetch=Date.now();syncProgressUI();updateSettingsMeta()}catch(e){rooms.progress.messages=[['system',`canonical同期エラー: ${e.message}`,'',[]]]}finally{progressLoading=false;if(current==='progress'&&!settingsOpen)render(true);updateSettingsMeta()}}\nconst sleep="""
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'loadCanonicalProgress replacement failed: {count}')

          once(
              "pushChat(['system','今回は誰も反応しなかった。',now(),[]]);render()",
              "pushChat(['system','今回は誰も反応しなかった。',now(),[]],true);render(true)"
          )
          once(
              "pushChat([r.agent,r.text,now(),[]]);render()",
              "pushChat([r.agent,r.text,now(),[]],true);render(true)"
          )
          once(
              "pushChat(['system',`AI接続エラー: ${e.message}`,now(),[]]);render()",
              "pushChat(['system',`AI接続エラー: ${e.message}`,now(),[]],true);render(true)"
          )
          once('}finally{busy=false;render()}}', '}finally{busy=false;render(true)}}')

          once(
              "feed.addEventListener('scroll',syncJumpBottom,{passive:true});jumpBottom.addEventListener('click',jumpToBottom);",
              "feed.addEventListener('scroll',syncFeedScrollState,{passive:true});jumpBottom.addEventListener('click',jumpToBottom);"
          )
          once(
              "document.getElementById('settingsClearRandom').addEventListener('click',()=>{if(!confirm(`この端末の #${normalizedRoomName('chat')} 履歴を削除します。GitHub側のデータには影響しません。`))return;rooms.chat.messages=[];saveState();",
              "document.getElementById('settingsClearRandom').addEventListener('click',()=>{if(!confirm(`この端末の #${normalizedRoomName('chat')} 履歴を削除します。GitHub側のデータには影響しません。`))return;rooms.chat.messages=[];delete unreadCounts.chat;saveState();"
          )
          once(
              "setInterval(()=>{if(current==='progress')loadCanonicalProgress(true)},300000);",
              "setInterval(()=>loadCanonicalProgress(true),300000);"
          )

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'チャンネルを追加</span></button>',
              'class="unread-badge"',
              'function markRead(ch)',
              'function syncFeedScrollState()',
              'progressKnownId',
              'scrollbar-width:thin',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'missing validation marker: {item}')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one script block, got {len(scripts)}')
          Path('/tmp/app.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --exit-code --quiet -- index.html && { echo 'No change produced'; exit 1; } || true

      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: polish channels and unread badges'
          git push origin HEAD:main
          git push origin --delete __invalid_should_not_create__ || true
