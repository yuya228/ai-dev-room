name: Temporary About Rules split

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run temporary About Rules split' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split About Rules from Settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '<button class="channel" id="desktopSettings"><svg class="hash settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M9.21 5.26 L10.26 2.15 L13.74 2.15 L14.79 5.26 L17.74 3.81 L20.19 6.26 L18.74 9.21 L21.85 10.26 L21.85 13.74 L18.74 14.79 L20.19 17.74 L17.74 20.19 L14.79 18.74 L13.74 21.85 L10.26 21.85 L9.21 18.74 L6.26 20.19 L3.81 17.74 L5.26 14.79 L2.15 13.74 L2.15 10.26 L5.26 9.21 L3.81 6.26 L6.26 3.81 Z"></path></svg><span>Settings</span></button>',
              '<button class="channel" id="desktopSettings"><svg class="hash settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M9.21 5.26 L10.26 2.15 L13.74 2.15 L14.79 5.26 L17.74 3.81 L20.19 6.26 L18.74 9.21 L21.85 10.26 L21.85 13.74 L18.74 14.79 L20.19 17.74 L17.74 20.19 L14.79 18.74 L13.74 21.85 L10.26 21.85 L9.21 18.74 L6.26 20.19 L3.81 17.74 L5.26 14.79 L2.15 13.74 L2.15 10.26 L5.26 9.21 L3.81 6.26 L6.26 3.81 Z"></path></svg><span>Settings</span></button><button class="channel" id="desktopAboutRules"><svg class="hash settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10v6"></path><path d="M12 7h.01"></path></svg><span>About / Rules</span></button>'
            ),
            (
              '<div class="right-title">この部屋のルール</div><div class="card routine" id="roomRule">Randomでは、必要なAIだけが反応。作業実行はしない。</div>',
              ''
            ),
            (
              '<div class="drawer-section">システム</div><button class="drawer-setting" id="settingsToggle"><span class="settings-label"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M9.21 5.26 L10.26 2.15 L13.74 2.15 L14.79 5.26 L17.74 3.81 L20.19 6.26 L18.74 9.21 L21.85 10.26 L21.85 13.74 L18.74 14.79 L20.19 17.74 L17.74 20.19 L14.79 18.74 L13.74 21.85 L10.26 21.85 L9.21 18.74 L6.26 20.19 L3.81 17.74 L5.26 14.79 L2.15 13.74 L2.15 10.26 L5.26 9.21 L3.81 6.26 L6.26 3.81 Z"></path></svg><span>Settings</span></span><span>›</span></button>',
              '<div class="drawer-section">システム</div><button class="drawer-setting" id="settingsToggle"><span class="settings-label"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M9.21 5.26 L10.26 2.15 L13.74 2.15 L14.79 5.26 L17.74 3.81 L20.19 6.26 L18.74 9.21 L21.85 10.26 L21.85 13.74 L18.74 14.79 L20.19 17.74 L17.74 20.19 L14.79 18.74 L13.74 21.85 L10.26 21.85 L9.21 18.74 L6.26 20.19 L3.81 17.74 L5.26 14.79 L2.15 13.74 L2.15 10.26 L5.26 9.21 L3.81 6.26 L6.26 3.81 Z"></path></svg><span>Settings</span></span><span>›</span></button><button class="drawer-setting" id="aboutRulesToggle"><span class="settings-label"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10v6"></path><path d="M12 7h.01"></path></svg><span>About / Rules</span></span><span>›</span></button>'
            ),
            (
              '<section class="settings-group"><h2 class="settings-section-title">About / Rules</h2><div><div class="settings-rule-row"><strong>プライバシー</strong><span>GitHubに個人情報・認証情報・秘密情報を書き込まない。</span></div><div class="settings-rule-row"><strong>複数チャット運用</strong><span>書き込み直前に最新状態を確認し、他チャットの変更を消さない。</span></div><div class="settings-rule-row"><strong>AI開発ルール</strong><span>Phase境界、narrow fix、Work QAの独立性、最終PASSまでの総コストを優先する。</span></div></div></section>\n',
              ''
            ),
            (
              '</div></div></section></div>\n<div class="channel-editor-backdrop" id="channelEditorBackdrop"',
              '</div></div></section></div>\n<div class="settings-backdrop" id="aboutRulesBackdrop" aria-hidden="true"><section class="settings-panel" aria-labelledby="aboutRulesTitle"><header class="settings-head"><button class="settings-mobile-menu" id="aboutRulesMobileMenu" aria-label="メニューを開く">☰</button><div><div class="settings-title" id="aboutRulesTitle">About / Rules</div><div class="settings-sub">プライバシー・運用ルール</div></div></header><div class="settings-scroll"><div class="settings-body"><section class="settings-group"><div><div class="settings-rule-row"><strong>プライバシー</strong><span>GitHubに個人情報・認証情報・秘密情報を書き込まない。</span></div><div class="settings-rule-row"><strong>複数チャット運用</strong><span>書き込み直前に最新状態を確認し、他チャットの変更を消さない。</span></div><div class="settings-rule-row"><strong>AI開発ルール</strong><span>Phase境界、narrow fix、Work QAの独立性、最終PASSまでの総コストを優先する。</span></div><div class="settings-rule-row"><strong>Random</strong><span>Workers AIが必要なAIだけ1〜3人選んで反応。複数人ならAI同士でも会話をつなぐ。作業実行はしない。</span></div></div></section></div></div></section></div>\n<div class="channel-editor-backdrop" id="channelEditorBackdrop"'
            ),
            (
              "settingsOpen=false,editingMode='channel'",
              "settingsOpen=false,systemPanel='',editingMode='channel'"
            ),
            (
              "rule=document.getElementById('roomRule'),sendBtn=",
              "rule=document.getElementById('roomRule'),sendBtn="
            ),
            (
              "const drawer=document.getElementById('drawer'),drawerBackdrop=document.getElementById('drawerBackdrop'),settingsBackdrop=document.getElementById('settingsBackdrop'),desktopSettings=document.getElementById('desktopSettings'),settingsToggle=document.getElementById('settingsToggle'),desktopWorkspace=",
              "const drawer=document.getElementById('drawer'),drawerBackdrop=document.getElementById('drawerBackdrop'),settingsBackdrop=document.getElementById('settingsBackdrop'),aboutRulesBackdrop=document.getElementById('aboutRulesBackdrop'),desktopSettings=document.getElementById('desktopSettings'),settingsToggle=document.getElementById('settingsToggle'),desktopAboutRules=document.getElementById('desktopAboutRules'),aboutRulesToggle=document.getElementById('aboutRulesToggle'),desktopWorkspace="
            ),
            (
              "function syncNavState(){renderChannelNav();syncCollapsedSections();desktopSettings.classList.toggle('active',settingsOpen);settingsToggle.classList.toggle('active',settingsOpen)}",
              "function syncNavState(){renderChannelNav();syncCollapsedSections();desktopSettings.classList.toggle('active',settingsOpen&&systemPanel==='settings');settingsToggle.classList.toggle('active',settingsOpen&&systemPanel==='settings');desktopAboutRules.classList.toggle('active',settingsOpen&&systemPanel==='about');aboutRulesToggle.classList.toggle('active',settingsOpen&&systemPanel==='about')}"
            ),
            (
              "rule.textContent=r.rule;",
              "if(rule)rule.textContent=r.rule;"
            ),
            (
              "function openSettings(){closeSearch();closeDrawer();settingsOpen=true;updateSettingsMeta();settingsBackdrop.classList.add('open');settingsBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction closeSettings(){settingsOpen=false;settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');syncNavState()}",
              "function openSettings(){closeSearch();closeDrawer();settingsOpen=true;systemPanel='settings';aboutRulesBackdrop.classList.remove('open');aboutRulesBackdrop.setAttribute('aria-hidden','true');updateSettingsMeta();settingsBackdrop.classList.add('open');settingsBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction openAboutRules(){closeSearch();closeDrawer();settingsOpen=true;systemPanel='about';settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');aboutRulesBackdrop.classList.add('open');aboutRulesBackdrop.setAttribute('aria-hidden','false');syncNavState()}\nfunction closeSettings(){settingsOpen=false;systemPanel='';settingsBackdrop.classList.remove('open');settingsBackdrop.setAttribute('aria-hidden','true');aboutRulesBackdrop.classList.remove('open');aboutRulesBackdrop.setAttribute('aria-hidden','true');syncNavState()}"
            ),
            (
              "document.getElementById('settingsMobileMenu').addEventListener('click',openDrawer);",
              "document.getElementById('settingsMobileMenu').addEventListener('click',openDrawer);document.getElementById('aboutRulesMobileMenu').addEventListener('click',openDrawer);"
            ),
            (
              "settingsToggle.addEventListener('click',openSettings);desktopSettings.addEventListener('click',openSettings);desktopWorkspace.addEventListener('click',openWorkspaceEditor);",
              "settingsToggle.addEventListener('click',openSettings);desktopSettings.addEventListener('click',openSettings);aboutRulesToggle.addEventListener('click',openAboutRules);desktopAboutRules.addEventListener('click',openAboutRules);desktopWorkspace.addEventListener('click',openWorkspaceEditor);"
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'desktopAboutRules': 3,
              'aboutRulesToggle': 3,
              'aboutRulesBackdrop': 7,
              '<strong>Random</strong>': 1,
              'この部屋のルール': 0,
              '<h2 class="settings-section-title">About / Rules</h2>': 0,
          }
          for marker, expected in checks.items():
              count = text.count(marker)
              if count != expected:
                  raise SystemExit(f'validation failed {marker!r}: {count} != {expected}')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: split About Rules from Settings'
          git push origin HEAD:main
